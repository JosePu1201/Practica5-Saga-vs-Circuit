server.servlet.context-path=/api
springdoc.swagger-ui.use-root-path=true
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
spring.application.name=OrderService
spring.main.allow-bean-definition-overriding=true
server.port=8082

spring.jackson.time-zone=America/Guatemala
spring.jpa.properties.hibernate.jdbc.time_zone = America/Guatemala

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

spring.datasource.url=jdbc:mysql://localhost:3306/OrderService
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Control de reintentos y prevención de bucles infinitos
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# =======================================================
# Circuit Breaker Demo Configuration (Resilience4j)
# =======================================================
circuitbreaker.demo.enabled=${CIRCUIT_BREAKER_DEMO_ENABLED:false}
circuitbreaker.demo.target-url=${CIRCUIT_BREAKER_DEMO_TARGET_URL:http://localhost:8083/api/circuit-breaker/demo-dependency}
circuitbreaker.demo.connect-timeout-ms=2000
circuitbreaker.demo.read-timeout-ms=2000

# Parámetros del Circuit Breaker
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderDemoCircuitBreaker.permitted-number-of-calls-in-half-open-state=3